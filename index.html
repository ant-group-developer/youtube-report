<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YouTube Report</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./libs/bootstrap/5.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" href="./assets/logo.png" type="image/x-icon">
</head>

<body class="mx-auto px-5 pb-3 pt-0">
    <div class="">

        <div id="table-wrapper" class="">
            <div class="py-2 bg-white d-flex justify-content-between align-items-center gap-3">
                <div class="d-flex gap-2 align-items-center flex-grow-1">
                    <img src="./assets/logo.png" width="60px" height="100%">
                    <div class="input-group flex-nowrap w-100 ms-3" style="height: 33px; max-width: 400px;">
                        <span class="input-group-text" id="addon-wrapping">
                            <i class="bi bi-search"></i>
                        </span>
                        <input id="search" class="form-control" type="text" placeholder="Search...">
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <button type="button" id="export" class="btn btn-primary">
                        <i class="bi bi-filetype-xlsx"></i>
                        Export Excel
                    </button>
                    <button type="button" class="btn btn-secondary" data-bs-toggle="modal"
                        data-bs-target="#form-modal-import">
                        <i class="bi bi-database-up"></i>
                        Import Data
                    </button>
                </div>
            </div>
        </div>

        <div id="alert-container" class="mb-2"></div>

        <div id="revenue-summary" class="mb-2 d-none"></div>

        <div class="rounded-2 border border-top-0 w-100">
            <table id="table" class="w-100 table table-striped">
                <thead class="sticky-top bg-white">
                    <tr>
                        <th data-field="UC" data-width="300" style="width: 15%;" data-width-unit="%">
                            Channel ID
                        </th>
                        <th data-field="Name" data-width="300" style="width: 17%;" data-width-unit="%">
                            Name
                        </th>
                        <th data-field="Deduction Amount" data-width="200" style="width: 9%;" data-width-unit="%">
                            US Revenue
                        </th>
                        <th data-field="Deduction Amount" data-width="200" style="width: 9%;" data-width-unit="%">
                            Tax Withholding Rate
                        </th>
                        <th data-field="Deduction Amount" data-width="200" style="width: 9%;" data-width-unit="%">
                            Tax Withheld Amount
                        </th>
                        <th data-field="Deduction Amount" data-width="200" style="width: 9%;" data-width-unit="%">
                            Revenue
                        </th>
                        <th data-field="Deduction Amount" data-width="200" style="width: 9%;" data-width-unit="%">
                            Adjustments Amount
                        </th>
                        <th data-field="Total Revenue" data-width="200" style="width: 9%;" data-width-unit="%">
                            Total Revenue
                        </th>
                        <th data-field="Total Revenue" data-width="200" style="width: 14%;" data-width-unit="%">
                            Note
                        </th>
                    </tr>
                </thead>
                <tbody id="table-body">

                </tbody>

                <tfoot class="fw-semibold">
                    <tr id="table-footer">
                        <td class="bg-dark-subtle">Total: 0 channel(s)</td>
                        <td class="bg-dark-subtle"></td>
                        <td class="bg-dark-subtle" data-field="US Revenue">0</td>
                        <td class="bg-dark-subtle"></td>
                        <td class="bg-dark-subtle" data-field="Tax Withheld Amount">0</td>
                        <td class="bg-dark-subtle" data-field="Revenue">0</td>
                        <td class="bg-dark-subtle" data-field="Deduction Amount">0</td>
                        <td class="bg-dark-subtle" data-field="Total Revenue">0</td>
                        <td class="bg-dark-subtle" data-field="Note"></td>
                    </tr>
                </tfoot>
            </table>

            <div id="no-data-message" class="alert text-center alert-dismissible">
                No data available.
            </div>

        </div>

        <nav class="mt-2 d-flex justify-content-between align-content-center">
            <div id="row-info" class="">

            </div>

            <ul id="pagination" class="pagination">
                <li class="page-item disabled">
                    <a class="page-link" href="#" id="previous-page">Previous</a>
                </li>
                <!-- Pagination links will be inserted here -->
                <li class="page-item">
                    <a class="page-link" href="#" id="next-page">Next</a>
                </li>
            </ul>
        </nav>
    </div>

    <!-- Modal Import -->
    <div class="modal fade" id="form-modal-import" tabindex="-1" aria-labelledby="modal-label" aria-hidden="true">
        <div class="modal-dialog modal-dialog-scrollable modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="modal-label">Import Report Data</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="csv-form">
                        <fieldset>
                            <div class="mb-3 row">
                                <div class="col-12">
                                    <label for="file-list" class="form-label fw-medium">File List</label>
                                </div>
                                <div class="col-12">
                                    <button type="button" id="btn-select-folder" class="btn btn-outline-primary mb-2">
                                        <i class="bi bi-folder2-open"></i> Select Report Folder
                                    </button>
                                    <div id="folder-path" class="text-success fw-medium mb-2"></div>
                                    <div class="error-message text-danger" id="file-list-error"></div>
                                </div>
                            </div>

                            <div id="import-file-details" class="mb-3 row d-none">
                                <div class="col-12 mb-3">
                                    <label for="month-select" class="form-label fw-medium">Available Months</label>
                                    <select id="month-select" class="form-select"></select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-medium">Files to be Processed</label>
                                    <ul id="processed-files-list" class="list-group">
                                    </ul>
                                </div>
                                <div class="col-12 mt-4 d-none" id="unused-files-section">
                                    <div class="d-flex justify-content-between align-items-end mb-2">
                                        <label class="form-label fw-medium text-danger mb-0"><span id="unused-files-header-text">Unused Report Files</span> <span id="unused-files-count" class="badge bg-danger rounded-pill ms-1"></span></label>
                                        <button type="button" id="btn-delete-all-unused" class="btn btn-danger btn-sm">
                                            <i class="bi bi-trash-fill"></i> Delete All Unused
                                        </button>
                                    </div>
                                    <ul id="unused-files-list" class="list-group mb-2" style="max-height: 200px; overflow-y: auto;">
                                    </ul>
                                </div>
                            </div>

                        </fieldset>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <!-- Submit -->
                    <button id="button-submit-import" type="submit" class="btn btn-primary">Submit</button>
                </div>
            </div>
        </div>
    </div>


    <!-- JQUERY -->
    <script src="./libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- BOOTSTRAP -->
    <script src="./libs/bootstrap/5.3.7/js/bootstrap.bundle.min.js"></script>

    <!-- PapaParse -->
    <script src="./libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <!--  -->
    <script src="./js/utils.js"></script>
    <script src="./js/constant.js"></script>
    <script src="./js/zip.js"></script>
    <script src="./js/excel.js"></script>
    <script src="./js/table.js"></script>
    <script src="./js/index.js"></script>

</body>

</html>
